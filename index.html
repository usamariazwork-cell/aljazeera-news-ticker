<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>BBC Live News Ticker</title>

<style>

body{
margin:0;
background:#000;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}


.container{
height:90px;
display:flex;
align-items:center;
background:#050505;
}


/* BBC LOGO */

.logo{
width:120px;
height:90px;
background:#e00000;
color:white;
font-size:42px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
}


/* CLOCK */

.time{
width:200px;
color:white;
font-size:18px;
font-weight:bold;
text-align:center;
line-height:25px;
}


/* NEWS AREA */

.ticker{
flex:1;
overflow:hidden;
white-space:nowrap;
}


.news{

display:inline-flex;
align-items:center;

animation:scroll 180s linear infinite;

}


.item{

color:white;
font-size:28px;
font-weight:500;

margin-right:180px;

}



/* SMOOTH SCROLL */

@keyframes scroll{

from{
transform:translateX(100%);
}

to{
transform:translateX(-100%);
}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
BBC
</div>



<div class="time" id="clock">
</div>



<div class="ticker">

<div class="news" id="news">
Loading BBC News...
</div>

</div>


</div>



<script>


// CLOCK

function updateClock(){

let now=new Date();

document.getElementById("clock").innerHTML =
now.toLocaleDateString("en-GB")
+
"<br>"
+
now.toLocaleTimeString("en-GB");


}


setInterval(updateClock,1000);

updateClock();




// BBC RSS NEWS

async function loadNews(){

try{


let url =
"https://api.allorigins.win/raw?url=https://feeds.bbci.co.uk/news/rss.xml";



let response = await fetch(url);


let text = await response.text();



let parser = new DOMParser();


let xml =
parser.parseFromString(text,"text/xml");



let items =
xml.querySelectorAll("item");



let output="";



items.forEach((item,index)=>{


if(index < 20){


let title =
item.querySelector("title").textContent;



output += `

<div class="item">

${title}

</div>

`;

}


});



document.getElementById("news").innerHTML =
output;


}

catch(error){


document.getElementById("news").innerHTML =
"BBC News unavailable";


}


}



loadNews();


// Update every 5 minutes

setInterval(loadNews,300000);



</script>


</body>
</html>
