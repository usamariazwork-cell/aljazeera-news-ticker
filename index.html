<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Jazeera Live News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    font-family:"Segoe UI",Arial,sans-serif;

}


.container{

    width:100%;
    height:90px;

    display:flex;

    align-items:center;

    background:#050505;

}


/* AL JAZEERA LOGO */

.logo{

    width:170px;
    height:90px;

    background:#000;

    color:#d4af37;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    font-weight:700;

    letter-spacing:1px;

    border-right:3px solid #d4af37;

    flex-shrink:0;

}



/* CLOCK */

.time{

    width:220px;

    color:#fff;

    text-align:center;

    font-size:18px;

    font-weight:700;

    line-height:24px;

    flex-shrink:0;

}



/* NEWS AREA */

.news-box{

    flex:1;

    height:90px;

    display:flex;

    align-items:center;

    overflow:hidden;

    padding:0 30px;

}



/* HEADLINE */

#headline{

    color:#fff;

    font-size:30px;

    font-weight:700;

    white-space:nowrap;

    width:100%;

    text-align:center;

    transform:translateX(120%);

    opacity:0;

}



/* RIGHT TO LEFT ENTRY */

.show{

    animation:slideIn 2.5s ease forwards;

}



@keyframes slideIn{

    from{

        transform:translateX(120%);

        opacity:0;

    }


    to{

        transform:translateX(0);

        opacity:1;

    }

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
ALJAZEERA
</div>


<div class="time" id="clock"></div>


<div class="news-box">

<div id="headline">
Loading Al Jazeera News...
</div>

</div>


</div>



<script>


// CLOCK

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =

    now.toLocaleDateString("en-GB",{

        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"

    })

    +

    "<br>"

    +

    now.toLocaleTimeString("en-GB",{

        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false

    });

}


updateClock();

setInterval(updateClock,1000);



// NEWS

let headlines=[];

let current=0;



async function loadNews(){

    try{

        const response = await fetch("news.json?v="+Date.now());


        if(!response.ok){

            throw new Error("news.json missing");

        }


        const data = await response.json();


        headlines=data.items || [];


        current=0;


        showHeadline();


    }


    catch(error){

        console.log(error);

        document.getElementById("headline").textContent =
        "Al Jazeera News unavailable";

    }

}




function showHeadline(){

    if(headlines.length===0){

        return;

    }


    const headline=document.getElementById("headline");


    headline.classList.remove("show");


    void headline.offsetWidth;


    headline.textContent=headlines[current];


    headline.classList.add("show");


}




function nextHeadline(){

    current++;


    if(current>=headlines.length){

        current=0;

    }


    showHeadline();

}




loadNews();


// Change headline every 15 seconds

setInterval(nextHeadline,15000);


// Update news every 5 minutes

setInterval(loadNews,300000);



</script>


</body>

</html>
