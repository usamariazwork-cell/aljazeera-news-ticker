<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>BBC Live News Ticker v2</title>

<style>

body{
    margin:0;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}


.container{
    height:90px;
    display:flex;
    align-items:center;
    background:#050505;
}


/* BBC LOGO */

.logo{
    width:120px;
    height:90px;
    background:#e00000;
    color:white;
    font-size:42px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* TIME */

.time{
    width:200px;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    line-height:25px;
}


/* TICKER */

.ticker{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
}


.news{
    display:inline-flex;
    align-items:center;
    animation:scroll 120s linear infinite;
}


.item{
    color:white;
    font-size:28px;
    font-weight:500;
    margin-right:180px;
}



/* SMOOTH MOVEMENT */

@keyframes scroll{

from{
    transform:translateX(0%);
}

to{
    transform:translateX(-100%);
}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
BBC
</div>



<div class="time" id="clock">
</div>



<div class="ticker">

<div class="news" id="news">

<div class="item">
Loading BBC News...
</div>

</div>

</div>


</div>



<script>


// CLOCK

function updateClock(){

let now = new Date();


document.getElementById("clock").innerHTML =

now.toLocaleDateString("en-GB")
+
"<br>"
+
now.toLocaleTimeString("en-GB");


}


setInterval(updateClock,1000);

updateClock();




// LOAD LOCAL NEWS.JSON

async function loadNews(){


try{


let response = await fetch("news.json");


let data = await response.json();



let output = "";



data.items.forEach(function(title){



output += `

<div class="item">

${title}

</div>

`;



});



document.getElementById("news").innerHTML = output;



}

catch(error){


document.getElementById("news").innerHTML =

"<div class='item'>BBC News unavailable</div>";


}


}



loadNews();



// Refresh news every 5 minutes

setInterval(loadNews,300000);



</script>


</body>
</html>
