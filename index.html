<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBC Live News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    font-family:"Segoe UI",Arial,sans-serif;

}


.container{

    width:100%;
    height:90px;

    display:flex;

    align-items:center;

    background:#050505;

}


/* BBC LOGO */

.logo{

    width:120px;
    height:90px;

    background:#bb1919;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    font-weight:700;

    flex-shrink:0;

}


/* CLOCK */

.time{

    width:220px;

    color:#fff;

    text-align:center;

    font-size:18px;

    font-weight:700;

    line-height:24px;

    flex-shrink:0;

}


/* NEWS AREA */

.news-box{

    flex:1;

    height:90px;

    display:flex;

    align-items:center;

    overflow:hidden;

    padding-left:30px;

}


#headline{

    color:#fff;

    font-size:30px;

    font-weight:700;

    white-space:nowrap;

    text-align:center;

    transform:translateX(120%);

    transition:transform 2s ease;

    width:100%;

}

.hide{

    opacity:0 !important;

    transform:translate3d(-80px,0,0) !important;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
BBC
</div>


<div class="time" id="clock"></div>


<div class="news-box">

<div id="headline">
Loading BBC News...
</div>

</div>


</div>



<script>


// CLOCK

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =

    now.toLocaleDateString("en-GB",{

        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"

    })

    +

    "<br>"

    +

    now.toLocaleTimeString("en-GB",{

        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false

    });

}


updateClock();

setInterval(updateClock,1000);



// NEWS

let headlines = [];

let current = 0;



async function loadNews(){

    try{

        const response = await fetch("news.json?v=" + Date.now());


        if(!response.ok){

            throw new Error("news.json not found");

        }


        const data = await response.json();


        headlines = data.items || [];


        if(headlines.length > 0){

            current = 0;

            document.getElementById("headline").textContent = headlines[current];

        }


    }

    catch(error){

        console.log(error);

        document.getElementById("headline").textContent =
        "BBC News unavailable";

    }

}




function showNextHeadline(){

    if(headlines.length === 0){

        return;

    }


    const headline = document.getElementById("headline");


    headline.classList.add("hide");



    setTimeout(function(){


        current++;


        if(current >= headlines.length){

            current = 0;

        }


        headline.textContent = headlines[current];


        headline.classList.remove("hide");


    },700);


}



loadNews();


// Change headline every 5 seconds

setInterval(showNextHeadline,5000);


// Update news every 5 minutes

setInterval(loadNews,300000);



</script>


</body>

</html>
