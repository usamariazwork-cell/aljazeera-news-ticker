<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBC Live News Ticker</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    font-family:"Segoe UI","Roboto",Arial,sans-serif;

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;

}

.container{

    height:90px;

    display:flex;

    align-items:center;

    background:#050505;

}

.logo{

    width:120px;
    height:90px;

    background:#bb1919;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;
    font-weight:700;

    flex-shrink:0;

}

.time{

    width:210px;

    color:#fff;

    text-align:center;

    font-size:18px;
    font-weight:700;

    line-height:24px;

    flex-shrink:0;

}

.ticker{

    flex:1;

    overflow:hidden;

    position:relative;

    height:90px;

    display:flex;

    align-items:center;

}

.news{

    display:flex;

    align-items:center;

    white-space:nowrap;

    animation:scroll 300s linear infinite;

    transform:translate3d(0,0,0);

    backface-visibility:hidden;

    will-change:transform;

}

.item{

    color:#fff;

    font-size:32px;

    font-weight:700;

    letter-spacing:.2px;

    margin-right:220px;

    white-space:nowrap;

}

@keyframes scroll{

    from{

        transform:translate3d(0,0,0);

    }

    to{

        transform:translate3d(-100%,0,0);

    }

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
BBC
</div>

<div class="time" id="clock"></div>

<div class="ticker">

<div class="news" id="news">

<div class="item">
Loading BBC News...
</div>

</div>

</div>

</div>

<script>

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =

        now.toLocaleDateString("en-GB",{

            weekday:"short",
            day:"2-digit",
            month:"short",
            year:"numeric"

        })

        +

        "<br>"

        +

        now.toLocaleTimeString("en-GB",{

            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false

        });

}

updateClock();

setInterval(updateClock,1000);



async function loadNews(){

    try{

        const response = await fetch("news.json?v="+Date.now());

        if(!response.ok){

            throw new Error("Unable to load news");

        }

        const data = await response.json();

        let html="";

        data.items.forEach(function(title){

            html += `<div class="item">${title}</div>`;

        });

        document.getElementById("news").innerHTML=html;

    }

    catch(error){

        console.error(error);

        document.getElementById("news").innerHTML=

        "<div class='item'>BBC News unavailable</div>";

    }

}

loadNews();

setInterval(loadNews,300000);

</script>

</body>
</html>
